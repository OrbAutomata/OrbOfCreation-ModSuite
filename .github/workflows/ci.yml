name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-data:
    name: Game-data tools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Synchronize locked dependencies
        working-directory: tools
        run: uv sync --locked --all-groups

      - name: Run package tests
        working-directory: tools
        run: uv run --frozen pytest

      - name: Verify committed game data
        working-directory: tools
        run: uv run --frozen orb-gamedata verify

  portable-tests:
    name: Portable tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked portable dependencies
        run: dotnet restore tests/OrbModding.Tests/OrbModding.Tests.csproj --locked-mode -p:UseGameStubs=true

      - name: Restore locked profiling dependencies
        run: >-
          dotnet restore tests/OrbModding.ProfileTests/OrbModding.ProfileTests.csproj
          --locked-mode -p:UseGameStubs=true -p:EnableServiceCycleProfiler=true

      - name: Restore locked contract-test dependencies
        run: dotnet restore tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj --locked-mode -p:UseGameStubs=true

      - name: Run fast game-independent tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-portable.ps1 -Lane Fast -NoRestore

      - name: Run compile-time profiling tests
        run: >-
          dotnet test tests/OrbModding.ProfileTests/OrbModding.ProfileTests.csproj
          --configuration Release --no-restore -p:UseGameStubs=true -p:EnableServiceCycleProfiler=true
          --results-directory artifacts/test-results/profile
          --logger "trx;LogFileName=profile.trx"

      - name: Run external-process repository contracts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-portable.ps1 -Lane ExternalProcess -NoBuild -NoRestore

      - name: Audit native contract manifest and reflection declarations
        run: >-
          dotnet test tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj
          --configuration Release --no-restore -p:UseGameStubs=true
          --results-directory artifacts/test-results/contracts
          --logger "trx;LogFileName=portable-contracts.trx"

      - name: Retain portable test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 30

  headless-behavior:
    name: Deterministic performance
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore tests/OrbModding.Tests/OrbModding.Tests.csproj --locked-mode -p:UseGameStubs=true

      - name: Run deterministic performance simulations
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-portable.ps1 -Lane PerformanceAll -NoRestore

      - name: Retain deterministic performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobuy-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/performanceall
          if-no-files-found: error
          retention-days: 90

  coverage:
    name: Production coverage floors
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore tests/OrbModding.Tests/OrbModding.Tests.csproj --locked-mode -p:UseGameStubs=true

      - name: Collect production coverage
        run: >-
          dotnet test tests/OrbModding.Tests/OrbModding.Tests.csproj
          --configuration Release --no-restore -p:UseGameStubs=true
          --filter "Category!=ExternalProcess"
          --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings
          --results-directory artifacts/coverage
          --logger "trx;LogFileName=coverage.trx"

      - name: Enforce coverage floors
        shell: pwsh
        run: |
          $coverage = Get-ChildItem artifacts/coverage -Recurse -Filter coverage.cobertura.xml |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $coverage) { throw 'Coverage report was not produced.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-coverage.ps1 -CoveragePath $coverage.FullName

      - name: Retain coverage and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 30

  repository-hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enforce tracked artifact boundaries
        shell: pwsh
        run: |
          $manifestPath = 'lib/game-refs/v1.0.5/manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            Write-Error "Checked-in game-reference manifest is missing: $manifestPath"
            exit 1
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifestAssemblies = @($manifest.assemblies)
          if ($manifestAssemblies.Count -eq 0) {
            Write-Error 'Checked-in game-reference manifest lists no assemblies.'
            exit 1
          }

          $manifestFiles = @(
            foreach ($assembly in $manifestAssemblies) {
              $file = [string]$assembly.file
              if ([string]::IsNullOrWhiteSpace($file) -or
                  $file -ne [IO.Path]::GetFileName($file) -or
                  -not $file.EndsWith('.dll', [StringComparison]::OrdinalIgnoreCase)) {
                Write-Error "Invalid game-reference manifest file name: '$file'"
                exit 1
              }

              $expectedHash = [string]$assembly.outputSha256
              if ($expectedHash -notmatch '^[a-fA-F0-9]{64}$') {
                Write-Error "Invalid output SHA-256 for game reference: $file"
                exit 1
              }

              $path = "lib/game-refs/v1.0.5/$file"
              if (-not (Test-Path -LiteralPath $path)) {
                Write-Error "Manifest-listed game reference is missing: $path"
                exit 1
              }

              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($actualHash -ne $expectedHash) {
                Write-Error "Game-reference SHA-256 mismatch for ${path}: expected $expectedHash, actual $actualHash"
                exit 1
              }

              $path
            }
          )
          if (@($manifestFiles | Sort-Object -Unique).Count -ne $manifestFiles.Count) {
            Write-Error 'Checked-in game-reference manifest contains duplicate file names.'
            exit 1
          }

          $expectedGameRefs = @($manifestPath) + $manifestFiles
          $trackedFiles = @(git ls-files)
          $forbidden = $trackedFiles | Where-Object {
            $_ -match '(^|/)(bin|obj|bin-stubs|obj-stubs|bin-profile|obj-profile|bin-profile-stubs|obj-profile-stubs)/' -or
            ($_ -match '\.(dll|exe|pdb|sav|pfx|p12|pem|key)$' -and $_ -notin $manifestFiles)
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            exit 1
          }

          $trackedGameRefs = @(git ls-files 'lib/game-refs/**')
          $gameRefDelta = Compare-Object $expectedGameRefs $trackedGameRefs
          if ($gameRefDelta) {
            $gameRefDelta | ForEach-Object {
              Write-Error "Checked-in game-reference set mismatch: $($_.SideIndicator) $($_.InputObject)"
            }
            exit 1
          }

          $required = @('README.md', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md')
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Required public repository file is missing: $path"
              exit 1
            }
          }

  release-policy:
    name: Release promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test release helpers
        run: tools/test-release-helpers.sh

      - name: Guard VERSION and CHANGELOG ownership
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            tools/check-release-policy.sh pull-request "${PR_BASE_SHA}" "${GITHUB_SHA}" "${PR_TITLE}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            tools/check-release-policy.sh push "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}"
          else
            tools/check-release-policy.sh push "${GITHUB_SHA}^" "${GITHUB_SHA}"
          fi
