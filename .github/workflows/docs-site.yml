name: Documentation site

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - tools/pyproject.toml
      - tools/uv.lock
      - .github/workflows/docs-site.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - tools/pyproject.toml
      - tools/uv.lock
      - .github/workflows/docs-site.yml

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install -r .github/dependencies/requirements.txt

      - name: Synchronize locked documentation dependencies
        run: uv sync --project tools --locked --only-group docs

      - name: Build documentation
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --project tools --frozen --only-group docs mkdocs build --strict --config-file mkdocs.yml

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs-site

  deploy:
    name: Publish documentation
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
