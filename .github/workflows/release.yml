name: Publish main builds

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  classify:
    name: Classify main publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.publication.outputs.kind }}
      tag: ${{ steps.publication.outputs.tag }}
      title: ${{ steps.publication.outputs.title }}
      version: ${{ steps.publication.outputs.version }}

    steps:
      - name: Check out main with release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check promotion policy and release helpers
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tools/check-release-policy.sh push "${BEFORE_SHA}" "${GITHUB_SHA}"
          tools/test-release-helpers.sh

      - name: Resolve beta or full release
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          source tools/release-common.sh
          version="$(read_released_version VERSION)"
          kind="$(publication_kind "${GITHUB_WORKSPACE}" "${version}")"
          if [[ "${kind}" == "release" ]]; then
            tag="$(release_tag_for_version "${version}")"
            extract_changelog_section CHANGELOG.md "${version}" >/dev/null
            title="${version}"
          else
            tag="$(derive_beta_tag "${GITHUB_WORKSPACE}" "${version}" "${GITHUB_SHA}")"
            beta_number="${tag##*.}"
            title="${version} beta ${beta_number}"
          fi

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Publication tag already exists: ${tag}" >&2
            exit 1
          fi

          echo "kind=${kind}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "title=${title}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "Publication: kind=${kind} tag=${tag} version=${version}"

  portable-tests:
    name: Portable, profile, and refs-contract tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore locked portable dependencies
        run: dotnet restore tests/OrbModding.Tests/OrbModding.Tests.csproj --locked-mode -p:UseGameStubs=true

      - name: Restore locked profiling dependencies
        run: >-
          dotnet restore tests/OrbModding.ProfileTests/OrbModding.ProfileTests.csproj
          --locked-mode -p:UseGameStubs=true -p:EnableServiceCycleProfiler=true

      - name: Restore locked contract-test dependencies
        run: dotnet restore tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj --locked-mode -p:UseGameStubs=true

      - name: Run fast game-independent tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-portable.ps1 -Lane Fast -NoRestore

      - name: Run compile-time profiling tests
        run: >-
          dotnet test tests/OrbModding.ProfileTests/OrbModding.ProfileTests.csproj
          --configuration Release --no-restore -p:UseGameStubs=true -p:EnableServiceCycleProfiler=true
          --results-directory artifacts/test-results/profile
          --logger "trx;LogFileName=profile.trx"

      - name: Run external-process repository contracts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-portable.ps1 -Lane ExternalProcess -NoBuild -NoRestore

      - name: Audit native contracts and checked-in references
        run: >-
          dotnet test tests/OrbModding.GameContractTests/OrbModding.GameContractTests.csproj
          --configuration Release --no-restore -p:UseGameStubs=true
          --results-directory artifacts/test-results/contracts
          --logger "trx;LogFileName=portable-contracts.trx"

      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 30

  repository-hygiene:
    name: Repository hygiene
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enforce tracked artifact boundaries
        shell: pwsh
        run: |
          $manifestPath = 'lib/game-refs/v1.0.5/manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            Write-Error "Checked-in game-reference manifest is missing: $manifestPath"
            exit 1
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifestAssemblies = @($manifest.assemblies)
          if ($manifestAssemblies.Count -eq 0) {
            Write-Error 'Checked-in game-reference manifest lists no assemblies.'
            exit 1
          }

          $manifestFiles = @(
            foreach ($assembly in $manifestAssemblies) {
              $file = [string]$assembly.file
              if ([string]::IsNullOrWhiteSpace($file) -or
                  $file -ne [IO.Path]::GetFileName($file) -or
                  -not $file.EndsWith('.dll', [StringComparison]::OrdinalIgnoreCase)) {
                Write-Error "Invalid game-reference manifest file name: '$file'"
                exit 1
              }

              $expectedHash = [string]$assembly.outputSha256
              if ($expectedHash -notmatch '^[a-fA-F0-9]{64}$') {
                Write-Error "Invalid output SHA-256 for game reference: $file"
                exit 1
              }

              $path = "lib/game-refs/v1.0.5/$file"
              if (-not (Test-Path -LiteralPath $path)) {
                Write-Error "Manifest-listed game reference is missing: $path"
                exit 1
              }

              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($actualHash -ne $expectedHash) {
                Write-Error "Game-reference SHA-256 mismatch for ${path}: expected $expectedHash, actual $actualHash"
                exit 1
              }

              $path
            }
          )
          if (@($manifestFiles | Sort-Object -Unique).Count -ne $manifestFiles.Count) {
            Write-Error 'Checked-in game-reference manifest contains duplicate file names.'
            exit 1
          }

          $expectedGameRefs = @($manifestPath) + $manifestFiles
          $trackedFiles = @(git ls-files)
          $forbidden = $trackedFiles | Where-Object {
            $_ -match '(^|/)(bin|obj|bin-stubs|obj-stubs|bin-profile|obj-profile|bin-profile-stubs|obj-profile-stubs)/' -or
            ($_ -match '\.(dll|exe|pdb|sav|pfx|p12|pem|key)$' -and $_ -notin $manifestFiles)
          }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked artifact: $_" }
            exit 1
          }

          $trackedGameRefs = @(git ls-files 'lib/game-refs/**')
          $gameRefDelta = Compare-Object $expectedGameRefs $trackedGameRefs
          if ($gameRefDelta) {
            $gameRefDelta | ForEach-Object {
              Write-Error "Checked-in game-reference set mismatch: $($_.SideIndicator) $($_.InputObject)"
            }
            exit 1
          }

          $required = @('README.md', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md')
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Required public repository file is missing: $path"
              exit 1
            }
          }

  primary-build:
    name: Build release and perf-debug assets (Ubuntu)
    needs: [classify, portable-tests, repository-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build both publication flavors from committed refs
        run: tools/build-release-assets.sh artifacts/publish-primary

      - name: Upload primary publication assets
        uses: actions/upload-artifact@v7
        with:
          name: publication-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publish-primary
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish
    needs: [classify, portable-tests, repository-hygiene, primary-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out publication commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download primary assets
        uses: actions/download-artifact@v8
        with:
          name: publication-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/download/primary

      - name: Prepare publication notes and checksums
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_KIND: ${{ needs.classify.outputs.kind }}
          PUBLICATION_VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          source tools/release-common.sh
          notes_path="${RUNNER_TEMP}/publication-notes.md"
          if [[ "${PUBLICATION_KIND}" == "release" ]]; then
            section="$(extract_changelog_section CHANGELOG.md "${PUBLICATION_VERSION}")"
            printf '%s\n' "${section}" | sed '1d' >"${notes_path}"
          else
            pulls_path="${RUNNER_TEMP}/associated-pulls.json"
            pull_body=""
            if gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                >"${pulls_path}"; then
              pull_body="$(
                jq -r --arg sha "${GITHUB_SHA}" \
                  '[.[] | select(.merged_at != null)] |
                   (map(select(.merge_commit_sha == $sha)) + .) | first | .body // empty' \
                  "${pulls_path}" 2>/dev/null || true
              )"
            else
              echo "Associated-PR lookup failed; using the merge commit message." >&2
            fi
            if [[ -n "${pull_body//[[:space:]]/}" ]]; then
              printf '%s\n' "${pull_body}" >"${notes_path}"
            else
              git show -s --format=%B "${GITHUB_SHA}" >"${notes_path}"
            fi
          fi

          release_sha="$(sha256sum artifacts/download/primary/OrbModSuite-release.dll | awk '{print $1}')"
          profile_sha="$(sha256sum artifacts/download/primary/OrbModSuite-perf-debug.dll | awk '{print $1}')"
          printf '\n### Published assets\n\n' >>"${notes_path}"
          printf -- '- `OrbModSuite-release.dll` SHA-256: `%s`\n' "${release_sha}" >>"${notes_path}"
          printf -- '- `OrbModSuite-perf-debug.dll` SHA-256: `%s`\n' "${profile_sha}" >>"${notes_path}"
          printf '\nBoth assets were built from the SHA-locked committed game references and pinned SDK.\n' >>"${notes_path}"
          echo "notes_path=${notes_path}" >>"${GITHUB_OUTPUT}"
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"
          echo "profile_sha=${profile_sha}" >>"${GITHUB_OUTPUT}"

          printf '### Publication assets\n\n' >>"${GITHUB_STEP_SUMMARY}"
          printf -- '- Release SHA-256: `%s`\n' "${release_sha}" >>"${GITHUB_STEP_SUMMARY}"
          printf -- '- Perf-debug SHA-256: `%s`\n' "${profile_sha}" >>"${GITHUB_STEP_SUMMARY}"
          echo "OrbModSuite-release.dll SHA-256: ${release_sha}"
          echo "OrbModSuite-perf-debug.dll SHA-256: ${profile_sha}"

      - name: Fail if the tag or release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_TAG: ${{ needs.classify.outputs.tag }}
        run: |
          set -euo pipefail
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/${PUBLICATION_TAG}" >/dev/null 2>&1 || tag_status=$?
          case "${tag_status}" in
            0)
              echo "Publication tag already exists on origin: ${PUBLICATION_TAG}" >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not determine whether origin contains ${PUBLICATION_TAG}." >&2
              exit 1
              ;;
          esac

          api_output="${RUNNER_TEMP}/release-preflight.txt"
          release_status=0
          gh api -i "/repos/${GITHUB_REPOSITORY}/releases/tags/${PUBLICATION_TAG}" \
            >"${api_output}" 2>&1 || release_status=$?
          if [[ "${release_status}" -eq 0 ]]; then
            echo "GitHub release already exists: ${PUBLICATION_TAG}" >&2
            exit 1
          fi
          if ! grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404|Not Found' "${api_output}"; then
            cat "${api_output}" >&2
            echo "Could not prove that release ${PUBLICATION_TAG} is absent." >&2
            exit 1
          fi

      - name: Create annotated tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_KIND: ${{ needs.classify.outputs.kind }}
          PUBLICATION_TAG: ${{ needs.classify.outputs.tag }}
          PUBLICATION_TITLE: ${{ needs.classify.outputs.title }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${PUBLICATION_TAG}" "${GITHUB_SHA}" -m "${PUBLICATION_TITLE}"
          git push origin "refs/tags/${PUBLICATION_TAG}"

          release_args=(
            "${PUBLICATION_TAG}"
            "artifacts/download/primary/OrbModSuite-release.dll"
            "artifacts/download/primary/OrbModSuite-perf-debug.dll"
            "artifacts/download/primary/OrbModSuite-SHA256SUMS.txt"
            --verify-tag
            --title "${PUBLICATION_TITLE}"
            --notes-file "${NOTES_PATH}"
          )
          if [[ "${PUBLICATION_KIND}" == "beta" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
          echo "Published ${PUBLICATION_TAG}."
