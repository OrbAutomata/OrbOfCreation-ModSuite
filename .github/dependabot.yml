version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/tools"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      python-dependencies:
        patterns: ["*"]

  # Root discovery includes every project and the local .NET tool manifest.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      nuget-dependencies:
        patterns: ["*"]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2

  - package-ecosystem: "pip"
    directory: "/.github/dependencies"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      ci-tools:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns: ["*"]
