[project]
name = "orbofcreation-tools"
version = "0.1.0"
description = "Read-only tools for Orb of Creation mod development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typetreegeneratorapi==0.0.10",
    "unitypy==1.25.4",
]

[project.scripts]
orb-gamedata = "orbtools.gamedata.cli:main"
find-entity = "orbtools.gamedata.find_entity:main"
import-entity-display-names = "orbtools.gamedata.import_display_names:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9.7.7,<10",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbtools"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
exclude-newer = "2 days"
