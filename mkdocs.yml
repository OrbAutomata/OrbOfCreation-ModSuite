site_name: Orb Of Creation ModSuite
site_url: https://orbautomata.github.io/OrbOfCreation-ModSuite/
repo_url: https://github.com/OrbAutomata/OrbOfCreation-ModSuite
repo_name: OrbAutomata/OrbOfCreation-ModSuite

docs_dir: docs
site_dir: artifacts/docs-site
strict: true

theme:
  name: material
  logo: assets/orb-logo.svg
  favicon: assets/orb-logo.svg
  palette:
    scheme: slate
  features:
    - navigation.indexes
    - search.highlight
    - search.suggest

plugins:
  - search

extra_css:
  - assets/orb-theme.css

markdown_extensions:
  - toc:
      permalink: true

exclude_docs: |
  **/AGENTS.md
  **/CLAUDE.md

